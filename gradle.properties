# Android Build Optimization (Official Android Developer Guide: https://developer.android.com/build/optimize-your-build#configure-gc)

# 1. Gradle Daemon JVM & Parallel Garbage Collector
# Uses Parallel GC for compilation throughput, 4GB heap to minimize GC pause frequency,
# 1GB MaxMetaspace to prevent daemon drops (Gradle #19750), and UTF-8 encoding.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 2. Kotlin Daemon JVM Options
# Allocates 2GB heap and parallel GC to the Kotlin compiler daemon
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC

# 3. Gradle Build Cache & Parallel Execution
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# 4. Android & Compiler Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=true
ksp.incremental=true

# 5. R8 Execution Profile & Full Mode Optimization (https://developer.android.com/build/r8-execution-profiles)
android.settings.executionProfile=high
android.enableR8.fullMode=true
# 6. Native Build Configuration Warnings Suppression
android.sync.suppressAgpWarnings=EXTERNAL_NATIVE_BUILD_CONFIGURATION
